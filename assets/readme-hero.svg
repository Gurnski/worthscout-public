<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">WorthScout — the reseller's operating system</title>
  <desc id="desc">A dark product showcase banner featuring the WorthScout brand, a scan result interface and the product workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09040f"/>
      <stop offset="0.5" stop-color="#12081f"/>
      <stop offset="1" stop-color="#071815"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="440" x2="590" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.54" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="card" x1="780" y1="70" x2="1140" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21142f"/>
      <stop offset="1" stop-color="#0b1817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1085 176) rotate(132) scale(340 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity=".23"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="32" fill="url(#dots)"/>
  <rect width="1280" height="560" rx="32" fill="url(#glow)"/>
  <path d="M0 468C221 396 360 486 544 423C709 367 826 245 1280 294V560H0V468Z" fill="#2dd4bf" fill-opacity=".035"/>

  <g transform="translate(78 68)">
    <rect width="64" height="64" rx="17" fill="#10071b" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M18 21V15H24M40 15H46V21M46 43V49H40M24 49H18V43" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <path d="M21 24L27.5 43L34 30L40.5 43L47 24" stroke="url(#accent)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="30" r="2.4" fill="#f0abfc"/>
  </g>
  <text x="162" y="105" fill="white" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="27" font-weight="750">WorthScout</text>
  <text x="162" y="131" fill="white" fill-opacity=".42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="650" letter-spacing="3.4">THE RESELLER'S OPERATING SYSTEM</text>

  <text x="78" y="231" fill="white" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="-2.5">Know more.</text>
  <text x="78" y="300" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="-2.5">Flip smarter.</text>
  <text x="80" y="348" fill="white" fill-opacity=".64" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Scan, verify, organise and present better resale opportunities</text>
  <text x="80" y="376" fill="white" fill-opacity=".64" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">from one focused workspace.</text>

  <g transform="translate(78 423)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650">
    <g><rect width="112" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".11"/><circle cx="22" cy="21" r="5" fill="#2dd4bf"/><text x="37" y="26" fill="white">Scanner</text></g>
    <g transform="translate(124 0)"><rect width="143" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".11"/><circle cx="22" cy="21" r="5" fill="#a78bfa"/><text x="37" y="26" fill="white">Opportunity</text></g>
    <g transform="translate(279 0)"><rect width="128" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".11"/><circle cx="22" cy="21" r="5" fill="#f0abfc"/><text x="37" y="26" fill="white">Photo Studio</text></g>
    <g transform="translate(419 0)"><rect width="112" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".11"/><circle cx="22" cy="21" r="5" fill="#2dd4bf"/><text x="37" y="26" fill="white">Inventory</text></g>
  </g>

  <g transform="translate(756 54)" filter="url(#shadow)">
    <rect width="444" height="454" rx="27" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="22" y="22" width="400" height="56" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".075"/>
    <circle cx="49" cy="50" r="11" fill="#2dd4bf" fill-opacity=".17"/><circle cx="49" cy="50" r="4" fill="#2dd4bf"/>
    <text x="71" y="46" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Item analysis</text>
    <text x="71" y="63" fill="white" fill-opacity=".38" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Evidence-led resale workspace</text>
    <rect x="333" y="38" width="69" height="24" rx="12" fill="#2dd4bf" fill-opacity=".10" stroke="#2dd4bf" stroke-opacity=".35"/>
    <text x="348" y="54" fill="#65ead6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">LIVE SIGNAL</text>

    <rect x="22" y="98" width="122" height="128" rx="18" fill="#0b0d11" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="40" y="116" width="86" height="92" rx="12" fill="#191b22"/>
    <path d="M60 142L72 129H94L108 143L99 187H68L60 142Z" fill="#30343f"/>
    <path d="M72 129L81 139L94 129" stroke="#667080" stroke-width="2"/>
    <path d="M83 139V187" stroke="#505866" stroke-width="1.5"/>

    <text x="164" y="121" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill-opacity=".45">IDENTIFIED ITEM</text>
    <text x="164" y="149" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="720">Technical jacket</text>
    <text x="164" y="174" fill="white" fill-opacity=".5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Dark grey · good condition</text>
    <text x="164" y="212" fill="#65ead6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="780">£42–£58</text>

    <g transform="translate(22 248)">
      <rect width="400" height="91" rx="18" fill="#ffffff" fill-opacity=".037" stroke="#ffffff" stroke-opacity=".075"/>
      <text x="18" y="25" fill="white" fill-opacity=".5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">PRICING SIGNAL</text>
      <path d="M22 68C86 64 106 48 158 54C211 60 245 31 305 39C340 44 363 27 381 22" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M22 68C86 64 106 48 158 54C211 60 245 31 305 39C340 44 363 27 381 22V75H22V68Z" fill="#2dd4bf" fill-opacity=".08"/>
      <circle cx="158" cy="54" r="4" fill="#a78bfa"/><circle cx="305" cy="39" r="4" fill="#f0abfc"/><circle cx="381" cy="22" r="4" fill="#2dd4bf"/>
    </g>

    <g transform="translate(22 357)">
      <rect width="126" height="73" rx="17" fill="#ffffff" fill-opacity=".037" stroke="#ffffff" stroke-opacity=".075"/>
      <text x="16" y="25" fill="white" fill-opacity=".42" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">DECISION</text><text x="16" y="51" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Verify first</text>
      <rect x="137" width="126" height="73" rx="17" fill="#ffffff" fill-opacity=".037" stroke="#ffffff" stroke-opacity=".075"/>
      <text x="153" y="25" fill="white" fill-opacity=".42" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">WORKSPACE</text><text x="153" y="51" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Save &amp; track</text>
      <rect x="274" width="126" height="73" rx="17" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".24"/>
      <text x="290" y="25" fill="#65ead6" fill-opacity=".8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">NEXT STEP</text><text x="290" y="51" fill="#65ead6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Build listing</text>
    </g>
  </g>
</svg>
